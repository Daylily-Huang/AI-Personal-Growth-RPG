name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  supabase-integration:
    runs-on: ubuntu-latest
    # Database-backed tests (migration smoke + final-state authority) need a live
    # Supabase stack. They skip harmlessly without XP_RPG_TEST_DB_URL, but here we
    # provision one so the authority gate actually runs in CI (Round13 P2-1/P2-2).
    services:
      docker:
        image: docker:27-dind
        options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.114.0

      - name: Start local Supabase stack
        run: supabase db start

      - name: Export local Supabase credentials
        run: |
          node -e '
            const { execSync } = require("child_process");
            const fs = require("fs");
            const raw = execSync("supabase status -o env", { encoding: "utf8" });
            const vars = {};
            for (const line of raw.split(/\r?\n/)) {
              const match = line.match(/^([A-Z0-9_]+)=(.*)$/);
              if (match) {
                let val = match[2].trim();
                if ((val.startsWith("\"") && val.endsWith("\"")) || (val.startsWith("\x27") && val.endsWith("\x27"))) {
                  val = val.slice(1, -1);
                }
                vars[match[1]] = val;
              }
            }
            const apiUrl = vars.API_URL;
            const pubKey = vars.PUBLISHABLE_KEY || vars.ANON_KEY;
            const secretKey = vars.SECRET_KEY || vars.SERVICE_ROLE_KEY;
            const dbUrl = vars.DB_URL;

            if (!apiUrl || !pubKey || !secretKey || !dbUrl) {
              console.error("Failed to parse local Supabase credentials from status output:", vars);
              process.exit(1);
            }

            const envFile = process.env.GITHUB_ENV;
            if (envFile) {
              const lines = [
                `NEXT_PUBLIC_SUPABASE_URL=${apiUrl}`,
                `NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${pubKey}`,
                `SUPABASE_SECRET_KEY=${secretKey}`,
                `XP_RPG_TEST_DB_URL=${dbUrl}`
              ];
              fs.appendFileSync(envFile, lines.join("\n") + "\n");
              console.log("Successfully exported Supabase credentials to GITHUB_ENV.");
            }
          '

      - name: Build production app
        run: pnpm build

      - name: Run database-backed tests
        run: pnpm test

      - name: Run E2E tests
        run: pnpm test:e2e
